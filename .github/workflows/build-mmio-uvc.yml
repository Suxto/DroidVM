name: Build MMIO crosvm with UVC

on:
  push:
    branches: [feat/standard-touchpad-capture-dev]
    paths:
      - .github/workflows/build-mmio-uvc.yml
      - scripts/crosvm/mmio-uvc.patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Sync Android build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y repo
          mkdir -p "$RUNNER_TEMP/aosp"
          cd "$RUNNER_TEMP/aosp"
          repo init -u https://github.com/Droid-VM/crosvm-minimal-manifest.git \
            -b droidvm -m crosvm-minimal.xml --depth=1 --no-clone-bundle
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/mmio.xml <<'EOF'
          <manifest>
            <extend-project name="crosvm" path="external/crosvm" revision="da647254c2a9c6458ac2f5e0d15fb4c33c6333a8" upstream="refs/heads/wip/virtio-mmio"/>
            <remove-project name="platform/external/virtio-media"/>
            <project name="virtio-media" path="external/virtio-media" remote="droidvm" revision="3fe8fb594f5761c4d70d0f05781af23f42b47698" upstream="refs/heads/wip/hackintosh"/>
          </manifest>
          EOF
          repo sync -c -j8 --no-tags --fail-fast
      - name: Build Android ARM64 runtime
        env:
          # The minimal manifest omits modules outside the runtime's dependency tree.
          ALLOW_MISSING_DEPENDENCIES: 'true'
          # This job ships a native executable and does not build Android framework boot jars.
          UNSAFE_DISABLE_HIDDENAPI_FLAGS: 'true'
          SOONG_UNBUFFERED_OUTPUT: '1'
        run: |
          cd "$RUNNER_TEMP/aosp"
          git -C external/crosvm apply --check "$GITHUB_WORKSPACE/scripts/crosvm/mmio-uvc.patch"
          git -C external/crosvm apply "$GITHUB_WORKSPACE/scripts/crosvm/mmio-uvc.patch"
          # Soong checks both the standalone build and the com.android.virt variants.
          python3 - <<'PY'
          import re
          from pathlib import Path

          build_file = Path("external/boringssl/Android.bp")
          blueprint = build_file.read_text()
          def allow_crosvm(match):
              module = match[0]
              for prop, value in (
                  ("visibility", "//external/crosvm/third_party/libdatachannel"),
                  ("apex_available", "com.android.virt"),
              ):
                  marker = f"    {prop}: [\n"
                  if module.count(marker) != 1:
                      raise SystemExit(f"Failed to locate libcrypto_static {prop} in BoringSSL")
                  module = module.replace(marker, marker + f'        "{value}",\n', 1)
              return module

          marker = r'^cc_library_static \{\n    name: "libcrypto_static",\n.*?^\}'
          blueprint, count = re.subn(marker, allow_crosvm, blueprint, flags=re.M | re.S)
          if count != 1:
              raise SystemExit("Failed to locate libcrypto_static in BoringSSL")
          build_file.write_text(blueprint)

          # Blueprint runs soong_build with a clean environment, independent of Ninja's -j.
          soong = Path("build/soong/ui/build/soong.go")
          source = soong.read_text()
          marker = 'invocationEnv := make(map[string]string)'
          if source.count(marker) != 1:
              raise SystemExit("Failed to locate the Soong builder environment")
          source = source.replace(marker, marker + '\n\tinvocationEnv["GOMEMLIMIT"] = "7GiB"'
                                  + '\n\tinvocationEnv["GOMAXPROCS"] = "2"')
          soong.write_text(source)

          # The MMIO branch's virtio-media uses the conversion from newer v4l2r.
          controls = Path("external/rust/crates/v4l2r/lib/src/ioctl/queryctrl.rs")
          source = controls.read_text()
          marker = 'pub struct CtrlId(u32);'
          if source.count(marker) != 1:
              raise SystemExit("Failed to locate v4l2r CtrlId")
          conversion = '''

          impl From<CtrlId> for u32 {
              fn from(id: CtrlId) -> Self {
                  id.0
              }
          }'''
          controls.write_text(source.replace(marker, marker + conversion, 1))
          PY
          source build/envsetup.sh
          lunch aosp_arm64-trunk_staging-userdebug
          free -h
          df -h .
          (
            while sleep 30; do
              date -u
              free -h
              df -h .
              ps -C soong_build,ninja,rustc,clang -o comm,rss,%cpu,etime --sort=-rss | head -n 9 || true
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          m -j2 crosvm_device_only
          kill "$monitor" 2>/dev/null || true
          trap - EXIT
          dir=out/soong/.intermediates/external/crosvm/crosvm_device_only/crosvm_device_only_bin
          runtime="$(find "$dir" -path '*/android_arm64*/crosvm' -type f | head -n1)"
          test -n "$runtime"
          product="$RUNNER_TEMP/mmio-uvc"
          mkdir -p "$product"
          cp "$runtime" "$product/crosvm"
          LC_ALL=C grep -aq -- 'uvc-camera' "$product/crosvm"
          file "$product/crosvm"
          (cd "$product" && sha256sum crosvm > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: crosvm-mmio-uvc-arm64
          path: ${{ runner.temp }}/mmio-uvc
          if-no-files-found: error
