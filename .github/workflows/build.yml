name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DROIDVM_PREBUILT_COMPRESSION_LEVEL: "9"
      HAS_SIGN_KEY: ${{ secrets.APP_SIGN_KEY_JKS != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fetch pinned Gradle through the official release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=$(gh api repos/gradle/gradle-distributions/releases/tags/v9.6.0 --jq '.assets[] | select(.name == "gradle-9.6.0-bin.zip") | .url')
          gh api -H 'Accept: application/octet-stream' "$ASSET" > "$RUNNER_TEMP/gradle-bin.zip"
          DIGEST=$(gh api "$ASSET" --jq '.digest | sub("^sha256:"; "")')
          echo "$DIGEST  $RUNNER_TEMP/gradle-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          for ATTEMPT in 1 2 3; do
            if gradle testDebugUnitTest; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build release APK
        run: gradle assembleRelease

      - name: Sign APKs with persistent fork key
        if: ${{ env.HAS_SIGN_KEY == 'true' }}
        env:
          APP_SIGN_KEY_JKS: ${{ secrets.APP_SIGN_KEY_JKS }}
          APP_SIGN_KEY_PASS: ${{ secrets.APP_SIGN_KEY_PASS }}
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          echo "$APP_SIGN_KEY_JKS" | base64 -d > /tmp/keystore.jks
          trap 'rm -f /tmp/keystore.jks' EXIT
          for BUILD_TYPE in debug release; do
            APK=$(find "app/build/outputs/apk/${BUILD_TYPE}" -name '*.apk' | head -1)
            ALIGNED="${APK%.apk}-aligned.apk"
            "${BUILD_TOOLS}/zipalign" -f -v 4 "$APK" "$ALIGNED"
            "${BUILD_TOOLS}/apksigner" sign \
              --ks /tmp/keystore.jks \
              --ks-pass env:APP_SIGN_KEY_PASS \
              --key-pass env:APP_SIGN_KEY_PASS \
              --out "$APK" \
              "$ALIGNED"
            rm -f "$ALIGNED"
          done

      - name: Get version name
        id: version
        run: |
          desc="$(git describe --long --tags | sed 's/^[vV]//')"
          if echo "$desc" | grep -qE '\-0\-g[0-9a-f]+$'; then
            ver="$(echo "$desc" | sed 's/-0-g[0-9a-f]*$//')"
          else
            ver="$(echo "$desc" | sed 's/\([^-]*-g\)/r\1/;s/-/./g')"
          fi
          echo "name=${ver}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DroidVM-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          archive: false

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: DroidVM-${{ steps.version.outputs.name }}-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
